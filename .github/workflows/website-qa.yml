name: Website QA and Deployment Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip lxml python-docx

      - name: Run page QA
        run: python scripts/qa_site.py

      - name: Run content-integrity QA
        run: python scripts/qa_content_integrity.py

      - name: Run predeployment check
        run: python scripts/predeploy_check.py

      - name: Build clean static deployment folder
        run: python scripts/build_static_dist.py

      - name: Verify built asset integrity
        run: python scripts/verify_dist_assets.py

      - name: Upload deployment build
        uses: actions/upload-artifact@v4
        with:
          name: aastha-static-dist
          path: dist
